# The CRM web app. Supabase runs separately (deploy/supabase-docker, the official setup).
# A fixed, unique project name: without it Docker uses the folder name ("deploy"), which can collide
# with another app's project on a shared server and replace its containers.
name: safar-crm
services:
  safar-crm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: safar-crm:latest
    container_name: safar-crm
    restart: unless-stopped
    env_file: .env.production
    # only nginx on this server can reach it
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    # the app talks to Supabase through the public address; resolve it to this server's nginx
    extra_hosts:
      - "${CRM_DOMAIN}:host-gateway"

  # Keeps ticket-import extraction moving: calls the app's worker endpoint every 30 s. Jobs, leases and retries
  # live in the database, so restarting this loses nothing. Does nothing unless IMPORT_WORKER_SECRET is set.
  safar-import-worker:
    image: node:22-alpine
    container_name: safar-import-worker
    restart: unless-stopped
    depends_on: [safar-crm]
    environment:
      APP_URL: http://safar-crm:3000
      IMPORT_WORKER_SECRET: ${IMPORT_WORKER_SECRET:-}
    volumes:
      - ../scripts/import-worker.mjs:/worker/import-worker.mjs:ro
    command: ["sh", "-c", "if [ -z \"$$IMPORT_WORKER_SECRET\" ]; then echo 'IMPORT_WORKER_SECRET not set: ticket imports wait for manual entry'; sleep infinity; fi; exec node /worker/import-worker.mjs"]
