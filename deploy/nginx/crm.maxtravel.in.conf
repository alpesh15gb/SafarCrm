# /etc/nginx/sites-available/crm.maxtravel.in   (then: ln -s ../sites-available/crm.maxtravel.in /etc/nginx/sites-enabled/)
# The CRM app runs on 127.0.0.1:3100, Supabase (its API gateway) on 127.0.0.1:8100. Both are private to this server.
# Get the certificate first (see deploy/DEPLOY.md step 4); this file expects it in /etc/letsencrypt/live/crm.maxtravel.in/

map $http_upgrade $safar_connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name crm.maxtravel.in;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.maxtravel.in;

    ssl_certificate     /etc/letsencrypt/live/crm.maxtravel.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.maxtravel.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 15m;              # tickets/documents are capped at 10 MB by the app
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # --- Supabase APIs used by the app and browser (logins, data, files, live notifications)
    location ~ ^/(auth|rest|storage)/v1/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;            # Supabase's gateway rejects HTTP/1.0 (older nginx's default) with "426 Upgrade Required"
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $safar_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    # never expose the admin dashboard or database meta API publicly (use an SSH tunnel; see DEPLOY.md)
    location ~ ^/(pg|graphql|functions|analytics)/ { return 404; }

    # --- the CRM app
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;   # must match the browser's address (form security check)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $safar_connection_upgrade;
        proxy_buffering off;               # lets pages stream
        proxy_read_timeout 120s;
    }
}
